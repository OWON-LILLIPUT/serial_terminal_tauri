[package]
name = "serial-terminal-ratatui"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = { version = "0.29", features = ["bracketed-paste"] }
dirs = "6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
tempfile = "3"
tui-term = "0.3.4"
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std"] }
windows-sys = { version = "0.52", features = [
  "Win32_Devices_Communication", "Win32_Foundation", "Win32_Security",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
] }

[profile.release]
strip = true
lto = "thin"
